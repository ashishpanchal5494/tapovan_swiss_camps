<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="url(#avatarGradient)"/>
  
  <!-- User icon -->
  <g transform="translate(40, 40)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="12" fill="white" opacity="0.9"/>
    
    <!-- Body -->
    <path d="M-20,20 C-20,8 -8,0 0,0 C8,0 20,8 20,20 L20,40 L-20,40 Z" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Border -->
  <circle cx="40" cy="40" r="39" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>